[package]
name = "x"
version.workspace = true
edition.workspace = true
description = "Development CLI tool for quest-log"
license = "MIT"
repository = "https://github.com/olij/quest-log"
readme = "../../README.md"
keywords = ["cli", "dev-tools", "development"]
categories = ["development-tools"]

[[bin]]
name = "x"
path = "src/main.rs"

[dependencies]
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
image = "0.25"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1.50", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
  "net",
  "macros",
] }
