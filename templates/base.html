<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{% block title %}Quest Log{% endblock %}</title>
		<link rel="icon" href="/images/favicon.png" type="image/png">
		<link rel="stylesheet" href="/style.css">
		<script type="module" src="/js/datastar.js"></script>
	</head>
	<body {% block body_attrs %}{% endblock %}>
		{% include "fragments/video-modal.html" %}
		<header class="game-header">
			<nav class="game-header-nav">
				<a href="/" class="nav-link{% block nav_active_quests %}{% endblock %}">
					<span class="nav-icon nav-icon--sword"></span>
					<span>Quests</span>
				</a>
				<a href="/highscore" class="nav-link{% block nav_active_highscore %}{% endblock %}">
					<span class="nav-icon nav-icon--trophy"></span>
					<span>Highscore</span>
				</a>
				<a href="/editor" class="nav-link{% block nav_active_editor %}{% endblock %}">
					<span class="nav-icon nav-icon--scroll"></span>
					<span>Editor</span>
				</a>
				<span class="nav-link nav-link--trailer" data-on:click="window.openVideoModal()">
					<span class="nav-icon nav-icon--crystal"></span>
					<span>Trailer</span>
				</span>
			</nav>
		</header>
		<div id="app">
			<div class="container">
				{% block content %}{% endblock %}
			</div>
		</div>
		{% block scripts %}{% endblock %}
		<script src="/js/video-modal.js"></script>
		<script type="module" src="/js/events.js"></script>
	</body>
</html>
