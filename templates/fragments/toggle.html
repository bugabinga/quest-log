<div class="quest-item{% if quest.completed_today %} completed{% endif %}"
     id="quest-{{ quest.id }}"
     style="view-transition-name: quest-{{ quest.id }};"
     data-view-transition="quest-morph"
     {% if was_just_completed %}data-just-completed="true"{% endif %}{% if was_just_uncompleted %}data-just-uncompleted="true"{% endif %}
>
	<div class="quest-content">
		<h3>{{ quest.title }}</h3>
		{% if quest.description.len() > 0 %}
		<p>{{ quest.description }}</p>
		{% endif %}
		<span class="exp-value">{{ quest.exp_value }} EXP</span>
	</div>
	<div class="quest-actions">
		<button class="toggle-btn{% if quest.completed_today %} completed{% endif %}"
		        type="button"
		        data-on:click__prevent="@post('/quests/toggle', { payload: { quest_id: {{ quest.id }}, client_id: $client_id } })"
		>
			{% if quest.completed_today %}
			✅ Completed
			{% else %}
			Mark Complete
			{% endif %}
		</button>
	</div>
</div>
