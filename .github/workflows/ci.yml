name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just check

  build-image:
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: gacts/install-podman@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: just push-container-release

  migrate-db:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: gacts/install-podman@v1
      - name: Test database migrations
        run: |
          # Create temporary volume for testing
          podman volume create quest-log-test-data || true

          # Run migrations using just (builds image if needed)
          just run-migrate --volume quest-log-test-data

          # Verify database file exists
          podman volume inspect quest-log-test-data --format '{{.Mountpoint}}' | xargs ls -la
