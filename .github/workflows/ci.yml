name: CI

on:
  push:
    branches: [trunk]
    tags: ["v*"]
  pull_request:
    branches: [trunk]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install dictator
        run: cargo install dictator
      - run: |
          cargo x check
          cargo x lint
          cargo x verify

  coverage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.30.0
      - name: Generate coverage report
        run: cargo x coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tarpaulin-report.xml
          fail_ci_if_error: false
          flags: unittests

  build-image:
    needs: check
    if: github.ref == 'refs/heads/trunk' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: gacts/install-podman@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: cargo x container push --release

  migrate-db:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gacts/install-podman@v1
      - name: Test database migrations
        run: cargo x container migrate quest-log-test-data

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            binary: quest-log
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            binary: quest-log
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: quest-log.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: zip
            binary: quest-log.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
            binary: quest-log
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: quest-log
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo x build --release --triple ${{ matrix.target }}
      - name: Package binary
        run: |
          mkdir -p release/${{ matrix.binary }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} release/${{ matrix.binary }}/
          cp README.md LICENSE release/
      - name: Create archive
        shell: bash
        run: |
          cd release
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -r ../quest-log-${{ matrix.target }}.zip *
          else
            tar -czvf ../quest-log-${{ matrix.target }}.tar.gz *
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Quest Log ${{ github.ref_name }}
          files: quest-log-${{ matrix.target }}.${{ matrix.ext }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
