# Rustsec Advisory Configuration
# https://rustsec.org/

# Enable vulnerability scanning for Cargo.lock
# This will alert you when new security vulnerabilities are discovered in your dependencies

advisories:
  # Enable all advisories
  enabled: true
  
  # Ignore advisories for unused dependencies (optional)
  ignore:
    # Example: RUSTSEC-0000-0000
    # Add advisory IDs to ignore here
    - RUSTSEC-2021-0041  # tempfile: vulnerability in older versions
    - RUSTSEC-2020-0097  # crossbeam-epoch: Memory corruption (old)
    - RUSTSEC-2020-0036  # pin-project: Soundness issue (old)

# Database configuration
database:
  # Path to the advisory database
  # Uses rustsec's default location if not specified
  path: ~/.cargo/advisory-db

# GitHub integration
github:
  # Enable GitHub security advisories integration
  enabled: true
  
  # Repository to report issues to
  # Uses current repository if not specified
  repo: bugabinga/quest-log
