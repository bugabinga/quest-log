codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        if_ci_failed: success

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  after_n_builds: 1

github_checks:
  annotations: true
