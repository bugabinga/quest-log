[workspace]
members = ["x"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[package]
name = "quest-log"
version.workspace = true
edition.workspace = true
description = "A gamified quest log and task tracker"
license = "MIT"
repository = "https://github.com/olij/quest-log"
readme = "README.md"
keywords = ["quest", "gamification", "task", "todo", "rpg"]
categories = ["gamification", "productivity", "web-applications"]

[lib]
doctest = false

[dependencies]
axum = { version = "*", features = ["multipart"] }
datastar = { version = "*", features = ["axum"] }
maud = "*"
sqlx = { version = "*", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "macros",
  "migrate",
] }
dotenvy = "*"
thiserror = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
  "net",
  "macros",
] }
tokio-stream = { version = "*", features = ["sync"] }
static-serve = "*"
chrono = { version = "*", features = ["serde"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
tracing-error = "*"
clap = { version = "*", features = ["derive"] }
futures = "*"
async-stream = "*"
crossterm = "*"
tower = "*"
tower-sessions = "*"
argon2 = { version = "*" }
axum-extra = { version = "*", features = ["cookie", "multipart"] }
rand_core = { version = "*", features = ["getrandom"] }
rpassword = "*"

[dev-dependencies]
reqwest = { version = "*", features = ["json", "stream"] }
tokio-test = "*"
proptest = "*"
tempfile = "*"
insta = { version = "*", features = ["yaml"] }
pretty_assertions = "*"
nix = { version = "*" }
libc = { version = "*" }

[build-dependencies]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = "thin"
panic = 'abort'
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "*"

[features]
test-utils = []

[lints.rust]
unused_unsafe = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

too_many_lines = "allow"
too_many_arguments = "allow"

arithmetic_side_effects = "warn"
expect_used = { level = "warn" }
should_panic_without_expect = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
pub_use = "warn"
todo = "warn"

missing_panics_doc = "deny"
allow_attributes_without_reason = "deny"
cfg_not_test = "deny"
verbose_file_reads = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
tests_outside_test_module = "deny"
