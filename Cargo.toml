[package]
name = "quest-log"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
datastar = { version = "0.3", features = ["axum"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
askama = "0.15"
dotenvy = "0.15"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
static-serve = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio-test = "0.4"
tower = { version = "0.5" }
proptest = "1.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.25.0"

[build-dependencies]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
