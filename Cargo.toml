[package]
name = "quest-log"
version = "0.0.0"
edition = "2024"
description = "Game-like TODO app for kids"
readme = "README.md"
license = "MIT"
repository = "https://github.com/bugabinga/quest-log"

[lib]
doctest = false

[dependencies]
axum = "0.8"
datastar = { version = "0.3", features = ["axum"] }
maud = "0.27"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "macros",
  "migrate",
] }
dotenvy = "0.15"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "signal",
  "net",
  "macros",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
static-serve = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error = "0.2"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
async-stream = "0.3"
ratatui = "0.30"
crossterm = "0.29"
tower = "0.5"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio-test = "0.4"
proptest = "1.10"
tempfile = "3.26.0"
ratatui-testlib = "0.1"
insta = { version = "1.46", features = ["yaml"] }
pretty_assertions = "1.4"
nix = { version = "0.31", optional = false }
libc = { version = "0.2", optional = false }

[build-dependencies]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = "thin"
panic = 'abort'
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"
