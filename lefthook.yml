#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
colors: true
verbose: true

pre-push:
  jobs:
    - run: cargo x fmt
    - run: cargo x lint

pre-commit:
  jobs:
    - run: cargo x fmt
    - run: cargo x lint
    - run: cargo x test

commit-msg:
  jobs:
    - run: cargo x commit validate {1}
